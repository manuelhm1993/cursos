<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Condificación unicode para todos los caracteres como los latinos -->
    <meta charset="UTF-8">

    <!-- Adapta el tamaño de la página al ancho del dispositivo e inicia con zoom normal -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Esta página web es la introducción a la sección avanzada del curso de HTML">
    <meta name="keywords" content="html, css, js">
    <meta name="author" content="Manuel Henriquez">
    <!-- AntiSEO, impide que se archive en caché por Google -->
    <meta name="robots" content="noarchive">

    <!-- Open Graph - Permiten imágenes en miniatura al compartir un link -->
    <meta name="OG:image" content="./../../assets/img/foto-perfil.jpg">
    <meta name="OG:title" content="Curso de HTML Avanzado">
    <meta name="OG:description" content="Página web de pruebas para aprender HTML5">
    <title>Curso de HTML - Audio & Video</title>

    <!-- Especifica el tipo de imagen, la busca y especifica el tipo de relación -->
    <link rel="shortcut icon" href="./../../assets/img/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../assets/css//audio-video/video.css">
</head>
<body>
    <a href="./../../index.html">
        Inicio 📌
    </a>

    <!-- Controles, ruta y mensaje de error. Poster es una imagen preload -->
    <video controls autoplay muted src="../../assets/video/uso-http.mp4" poster="./../../assets/img/foto-perfil.jpg">
        <track src="captios.vtt" default kind="captions" srclang="es" label="Español (Latinoamérica)">
        Tu navegador no soporta video
    </video>

    <audio controls autoplay muted src="../../assets/video/uso-http.mp4"></audio>
</body>
</html>
