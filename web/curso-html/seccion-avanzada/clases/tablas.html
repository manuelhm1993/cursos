<body>
    <a href="./../index.html">
        Inicio 📌
    </a>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Producto</th>
                <th>Costo</th>
                <th>Unidades</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Brazo gitano</td>
                <td>$24</td>
                <td>1Kg</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Galletas de fiesta</td>
                <td>$15</td>
                <td>100 unidades</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Torta</td>
                <td>$25</td>
                <td>1 unidad</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2">Total</th>
                <td colspan="2">$64</td>
            </tr>
        </tfoot>
    </table>
