<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de HTML - Listas</title>
</head>
<body>
    <!-- Ruta relativa: es relativa al archivo actual -->
    <a href="./../index.html">
        Inicio 📌
    </a>

    <form method="get" enctype="multipart/form-data">
        <!-- El atributo name identifica el campo para el backend -->
        <input type="text" required name="username">

        <!-- El placeholder es una marca de agua para ayuda visual -->
        <input type="email" placeholder="Escribe tu correo...">
        <input type="password">
        <input type="checkbox">
        <input type="radio" name="genero">
        <input type="radio" name="genero">
        <input type="file">
        <input type="date">
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
