<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de HTML - Listas</title>
</head>
<body>
    <a href="./../index.html">
        Inicio 📌
    </a>
    
    <h1>Uso de listas</h1>

    <hr>

    <h2>Listas ordenadas ol-li</h2>
    <ol>
        <li>Elemento #1</li>
        <li>Elemento #2</li>
        <li>Elemento #3</li>
    </ol>

    <hr>

    <h2>Listas desordenadas ul-li</h2>
    <ul>
        <li>Elemento #1</li>
        <li>Elemento #2</li>
        <li>Elemento #3</li>
    </ul>
</body>
</html>
