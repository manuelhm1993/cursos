<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de HTML - Primera página</title>
</head>
<body>
    <a href="./../index.html">
        Inicio 📌
    </a>

    <!-- Encabezados h{1,6}: donde h1 es el título de la página y debe haber solo 1 por página -->
    <h1>Título</h1>

    <!-- Títulos de secciones por jerarquía -->
    <h2>Subtítulo</h2>
    <h3>Subtítulo</h3>
    <h4>Subtítulo</h4>
    <h5>Subtítulo</h5>
    <h6>Subtítulo</h6>

    <!-- Párrafos: etiqueta p y deben describir una idea -->
    <p>
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Accusantium optio itaque illum et, suscipit nostrum. Ea a repellat, libero distinctio modi eum. Amet ducimus optio fugit voluptas iste officia itaque?
    </p>
</body>
</html>
