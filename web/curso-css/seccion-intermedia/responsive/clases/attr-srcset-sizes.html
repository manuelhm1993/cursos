<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de CSS - Responsive design atributos html</title>

    <link rel="stylesheet" href="./../assets/css/attr-srcset-sizes.css">
</head>
<body>
    <header class="header">
        <nav>
            <ul>
                <li><a href="./../../index.html">Inicio</a></li>
            </ul>
        </nav>
    </header>

    <figure>
        <!-- srcset hace en html un equivalente a media query css -->
        <img src="./../assets/img/perfil-360.jpg" alt="Foto de perfil small"
        srcset="./../assets/img/perfil-360.jpg 400w,
        ./../assets/img/perfil-600.jpg 600w,
        ./../assets/img/perfil-1024.jpg 1024w"
        sizes="(max-width: 400px) 360px, 
        (max-width: 600px) 600px, 900px">
        <figcaption>Foto de perfil redes sociales</figcaption>
    </figure>
</body>
</html>
