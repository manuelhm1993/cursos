<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de CSS - Link CSS</title>

    <!-- Estilos externos: un documento .css que se linkea a través del meta link -->
    <link rel="stylesheet" href="./../assets/css/link-css.css">

    <!-- Estilos internos: dentro de etiquetas style en un documento HTML -->
    <style>
        h1 {
            color: blue;
        }
    </style>
</head>
<body>
    <a href="./../index.html">
        Inicio 📌
    </a>

    <h1>Título</h1>

    <!-- Estilos inline: se agregan como atributos -->
    <p style="color: red; font-size: 20px;">
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ad dignissimos exercitationem tempora dolorem doloremque magni cum perspiciatis quae provident voluptas, beatae, facilis blanditiis recusandae facere illum reprehenderit at dicta laboriosam!
    </p>
</body>
</html>
