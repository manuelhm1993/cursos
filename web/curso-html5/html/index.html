<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso HTML5 - Fundamentos</title>
</head>
<body>
    <!-- Título principal, solo debe haber un h1 por página -->
    <h1>Primera página web</h1>

    <!-- Párrafo -->
    <p>Este es un párrafo con la etiqueta p</p>
    <p>En esta primera página iré practicando las etiquetas básicas de HTML</p>

    <!-- Línea divisoria horizontal en gris por defecto -->
    <hr style="height: 20px; background: blue; border: none; width: 50%;">

    <!-- Si no se usa la etiqueta br no se toma en cuenta ningún espacio vertical -->
    <p>
        Este texto tiene muchos espacios <br>
        y varios saltos de <br>
        línea el navegador lo ve como un solo párrafo
    </p>

    <a href="practica-titulos-parrafos.html">Guía de estudio de programación</a>
    <a href="listas.html">Uso de listas</a>
</body>
</html>
